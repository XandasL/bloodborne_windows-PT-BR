name: Build and Release Runners

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to GitHub'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD RUNNER
  # =========================================================================
  build-windows:
    name: Build Windows x64 Runner
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Vulkan SDK
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          echo "$vulkanPath\bin" >> $env:GITHUB_PATH

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows)
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreadedDLL"

      - name: Build Windows Runner (bb-probe)
        run: |
          cmake --build build --config Release --target bb-probe

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/bloodborne-windows-x64 -Force | Out-Null
          
          # Copy binaries
          Copy-Item "build/bb-probe.exe" "dist/bloodborne-windows-x64/"
          if (Test-Path "build/bb-gpu-capabilities.exe") {
            Copy-Item "build/bb-gpu-capabilities.exe" "dist/bloodborne-windows-x64/"
          }
          if (Test-Path "build/gpu/bbgpu.dll") {
            Copy-Item "build/gpu/bbgpu.dll" "dist/bloodborne-windows-x64/"
          }
          
          # Copy runner scripts and tooling
          Copy-Item "run.bat" "dist/bloodborne-windows-x64/"
          Copy-Item "run.ps1" "dist/bloodborne-windows-x64/"
          Copy-Item -Recurse "scripts" "dist/bloodborne-windows-x64/"
          Copy-Item "LICENSE" "dist/bloodborne-windows-x64/"
          Copy-Item "README.md" "dist/bloodborne-windows-x64/"

          # Archive
          Compress-Archive -Path "dist/bloodborne-windows-x64/*" -DestinationPath "dist/bloodborne-windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-windows-x64
          path: dist/bloodborne-windows-x64.zip
          retention-days: 14

  # =========================================================================
  # 2. LINUX BUILD RUNNER
  # =========================================================================
  build-linux:
    name: Build Linux x86_64 Runner
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 python3-pip \
            libvulkan-dev vulkan-tools \
            libboost-all-dev libfmt-dev libxxhash-dev \
            libavcodec-dev libavutil-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libwayland-dev

      - name: Install SDL3 from Source
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=ON
          sudo cmake --build /tmp/sdl3/build --target install

      - name: Configure CMake (Linux)
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w"

      - name: Build Linux Runner (bb-probe)
        run: |
          cmake --build build --config Release --target bb-probe

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist/bloodborne-linux-x86_64
          
          # Copy binaries
          cp build/bb-probe dist/bloodborne-linux-x86_64/
          if [ -f build/bb-gpu-capabilities ]; then
            cp build/bb-gpu-capabilities dist/bloodborne-linux-x86_64/
          fi
          if [ -f build/gpu/libbbgpu.so ]; then
            cp build/gpu/libbbgpu.so dist/bloodborne-linux-x86_64/
          fi
          
          # Copy runner scripts and tooling
          cp run.sh dist/bloodborne-linux-x86_64/
          cp -r scripts dist/bloodborne-linux-x86_64/
          cp LICENSE dist/bloodborne-linux-x86_64/
          cp README.md dist/bloodborne-linux-x86_64/
          
          # Archive
          tar -czf dist/bloodborne-linux-x86_64.tar.gz -C dist/bloodborne-linux-x86_64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-linux-x86_64
          path: dist/bloodborne-linux-x86_64.tar.gz
          retention-days: 14

  # =========================================================================
  # 3. AUTOMATED RELEASE PUBLISHER
  # =========================================================================
  release:
    name: Publish Release Artifacts
    needs: [build-windows, build-linux]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: bloodborne-windows-x64
          path: release-assets/

      - name: Download Linux Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: bloodborne-linux-x86_64
          path: release-assets/

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum bloodborne-windows-x64.zip > checksums.txt
          sha256sum bloodborne-linux-x86_64.tar.gz >> checksums.txt
          cat checksums.txt

      - name: Determine Release Tag and Title
        id: rel_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Bloodborne Runner Release ${TAG_NAME}"
            PRERELEASE="false"
          else
            TAG_NAME="nightly"
            RELEASE_NAME="Bloodborne Runner Automated Nightly Build"
            PRERELEASE="true"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag_name }}
          name: ${{ steps.rel_meta.outputs.release_name }}
          prerelease: ${{ steps.rel_meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          body: |
            ### Automated Binary Distribution for `bloodborne_windows`
            
            This automated release packages the high-performance cross-platform HLE runner and asset preparation pipeline for **Bloodborne (PS4 CUSA03173)** on 64-bit Windows and Linux.
            
            #### 📦 Included Packages:
            * **Windows x64:** `bloodborne-windows-x64.zip` (Native Win32 VEH / QPC runner, `run.bat`, `run.ps1`)
            * **Linux x86_64:** `bloodborne-linux-x86_64.tar.gz` (Native POSIX / sys_mmap runner, `run.sh`)
            * **Checksums:** `checksums.txt` (Cryptographic SHA-256 verification hashes)
            
            #### 🎮 Quick Start:
            1. Extract the archive matching your operating system.
            2. To verify your GPU hardware immediately (no game files required):
               * **Windows:** `.\run.ps1 -SmokeTest`
               * **Linux:** `./run.sh --smoke-test`
            3. To boot Bloodborne, place your legally dumped, decrypted `CUSA03173` directory and execute:
               * **Windows:** `$env:BB_GAME_DIR="C:\Path\To\CUSA03173"; .\run.ps1`
               * **Linux:** `export BB_GAME_DIR="/path/to/CUSA03173"; ./run.sh`
            
            ---
            *Fork Origin & Upstream Attribution: [deadinside28/bloodborne_pc](https://github.com/deadinside28/bloodborne_pc) & [shadPS4](https://github.com/shadps4-emu/shadPS4)*
            *Licensed under GNU General Public License v2.0 or later (GPL-2.0-or-later)*
          files: |
            release-assets/bloodborne-windows-x64.zip
            release-assets/bloodborne-linux-x86_64.tar.gz
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
