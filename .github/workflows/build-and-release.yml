name: Build Windows Runner

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to GitHub'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD RUNNER
  # =========================================================================
  build-windows:
    name: Build Windows x64 Runner
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python launcher and Windows mod overlay
        shell: pwsh
        run: |
          python -m compileall launcher scripts
          python -m unittest discover -s tests -p "test_mods.py"

      - name: Install Vulkan SDK
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          echo "$vulkanPath\bin" >> $env:GITHUB_PATH

      - name: Install Boost Headers
        shell: pwsh
        run: |
          $boostDir = "C:\boost_1_84_0"
          if (-not (Test-Path "$boostDir\boost\version.hpp")) {
            Write-Host "Downloading Boost 1.84.0 headers (7z archive)..."
            $boostArchive = "$env:RUNNER_TEMP\boost.7z"
            Invoke-WebRequest -Uri "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.7z" -OutFile $boostArchive
            7z x $boostArchive -o"C:\" -y | Out-Null
          }
          echo "BOOST_ROOT=$boostDir" >> $env:GITHUB_ENV
          echo "BOOST_INCLUDEDIR=$boostDir" >> $env:GITHUB_ENV
          echo "Boost_INCLUDE_DIR=$boostDir" >> $env:GITHUB_ENV

      - name: Install FFmpeg Shared (Dev)
        shell: pwsh
        run: |
          $ffmpegDir = "C:\ffmpeg"
          if (-not (Test-Path "$ffmpegDir\include\libavcodec\avcodec.h")) {
            Write-Host "Downloading FFmpeg shared build..."
            $ffmpegArchive = "$env:RUNNER_TEMP\ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile $ffmpegArchive
            Expand-Archive -Path $ffmpegArchive -DestinationPath "$env:RUNNER_TEMP\ffmpeg_extracted" -Force
            $extractedRoot = (Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg_extracted" -Directory | Select-Object -First 1).FullName
            Move-Item -Path $extractedRoot -Destination $ffmpegDir -Force
          }
          echo "FFMPEG_ROOT=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows)
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-B", "build",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"
          )
          if ($env:BOOST_ROOT) {
            $cmakeArgs += "-DBOOST_ROOT=$($env:BOOST_ROOT)"
            $cmakeArgs += "-DBoost_INCLUDE_DIR=$($env:BOOST_ROOT)"
          }
          if ($env:FFMPEG_ROOT) {
            $cmakeArgs += "-DFFMPEG_ROOT=$($env:FFMPEG_ROOT)"
          }
          cmake @cmakeArgs

      - name: Build Windows Runner (bb-probe)
        run: |
          cmake --build build --config Release --target bb-probe

      - name: Build Graphical Launcher (.exe)
        shell: pwsh
        run: |
          pip install pyinstaller
          $args = @(
            "-m", "PyInstaller",
            "--onefile",
            "--windowed",
            "--name", "BloodborneLauncher",
            "--add-data", "scripts;scripts",
            "--add-data", "patches;patches",
            "--collect-submodules", "xml",
            "--hidden-import", "prepare",
            "--hidden-import", "link_libc",
            "--hidden-import", "link_modules",
            "--hidden-import", "content_profile",
            "--hidden-import", "patches",
            "--hidden-import", "mod_manager",
            "launcher/bloodborne_gui.py"
          )
          python @args

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/bloodborne-windows-x64 -Force | Out-Null
          
          # Copy binaries
          Copy-Item "build/bb-probe.exe" "dist/bloodborne-windows-x64/"
          if (Test-Path "dist/BloodborneLauncher.exe") {
            Copy-Item "dist/BloodborneLauncher.exe" "dist/bloodborne-windows-x64/"
          }
          if (Test-Path "build/bb-gpu-capabilities.exe") {
            Copy-Item "build/bb-gpu-capabilities.exe" "dist/bloodborne-windows-x64/"
          }
          if (Test-Path "build/gpu/bbgpu.dll") {
            Copy-Item "build/gpu/bbgpu.dll" "dist/bloodborne-windows-x64/"
          }
          if (Test-Path "C:\ffmpeg\bin") {
            Copy-Item "C:\ffmpeg\bin\*.dll" "dist/bloodborne-windows-x64/"
          }
          if (Test-Path "build/dlss_bridge/shadps4_dlss.dll") {
            Copy-Item "build/dlss_bridge/shadps4_dlss.dll" "dist/bloodborne-windows-x64/"
          }
          if (Test-Path "build/fsr4_addon/shadps4_fsr4.dll") {
            Copy-Item "build/fsr4_addon/shadps4_fsr4.dll" "dist/bloodborne-windows-x64/"
          }
          
          # Copy runner scripts, launcher and tooling
          Copy-Item "run.bat" "dist/bloodborne-windows-x64/"
          Copy-Item "run.ps1" "dist/bloodborne-windows-x64/"
          Copy-Item -Recurse "scripts" "dist/bloodborne-windows-x64/"
          Copy-Item -Recurse "launcher" "dist/bloodborne-windows-x64/"
          Copy-Item "LICENSE" "dist/bloodborne-windows-x64/"
          Copy-Item "README.md" "dist/bloodborne-windows-x64/"
          Copy-Item "RUNNING_CUSA03173.md" "dist/bloodborne-windows-x64/"

          # Archive
          Compress-Archive -Path "dist/bloodborne-windows-x64/*" -DestinationPath "dist/bloodborne-windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-windows-x64
          path: dist/bloodborne-windows-x64.zip
          retention-days: 14
