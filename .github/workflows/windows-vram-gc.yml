name: Build Windows VRAM GC Test

on:
  push:
    branches:
      - test/vram-gc
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Runner
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Validate GPU monitor script syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = (Resolve-Path tools/monitor-gpu.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "GPU monitor parses in Windows PowerShell 5.1"

      - name: Build
        shell: msys2 {0}
        run: bash build.sh

      - name: Assemble ready-to-copy port update
        shell: pwsh
        run: |
          # The archive root matches the existing Bloodborne installation directory.
          # Players only need to extract and paste its contents alongside Bloodborne.exe.
          $root = "artifact"
          New-Item -ItemType Directory -Force -Path "$root/bin", "$root/tools" | Out-Null
          Copy-Item out/bb-probe.exe "$root/bin/bb-probe.exe"
          Copy-Item out/bb-gpu-capabilities.exe "$root/bin/bb-gpu-capabilities.exe"
          # Update the native Play Bloodborne.exe helper rather than shipping an unused bb-play.exe.
          Copy-Item out/bb-play.exe "$root/Play Bloodborne.exe"
          Copy-Item tools/monitor-gpu.ps1 "$root/tools/monitor-gpu.ps1"
          Copy-Item "Play Bloodborne + GPU Monitor.bat" "$root/Play Bloodborne + GPU Monitor.bat"

          $expectedFiles = @(
            "$root/bin/bb-probe.exe",
            "$root/bin/bb-gpu-capabilities.exe",
            "$root/Play Bloodborne.exe",
            "$root/tools/monitor-gpu.ps1",
            "$root/Play Bloodborne + GPU Monitor.bat"
          )
          foreach ($item in $expectedFiles) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Missing staged test file: $item"
            }
          }
          Write-Host "Ready to paste into the directory containing Bloodborne.exe:"
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            Write-Host ($_.FullName.Substring((Resolve-Path $root).Path.Length + 1))
          }

      - name: Upload ready-to-copy Windows update
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-windows-test-copiar-na-raiz
          path: artifact/
          if-no-files-found: error
