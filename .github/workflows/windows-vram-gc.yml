name: Build Windows VRAM GC Test

on:
  push:
    branches:
      - test/vram-gc
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Runner
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Build
        shell: msys2 {0}
        run: bash build.sh

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item out\bb-probe.exe artifact\
          Copy-Item out\bb-gpu-capabilities.exe artifact\
          Copy-Item out\bb-play.exe artifact\
          if (Test-Path out\gpu-build.log) { Copy-Item out\gpu-build.log artifact\ }
          Copy-Item tools\monitor-gpu.ps1 artifact\
          Copy-Item "Play Bloodborne + GPU Monitor.bat" artifact\

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-windows-vram-gc-test
          path: artifact
          if-no-files-found: error
